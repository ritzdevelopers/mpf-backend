
spring.profiles.active=dev

# Large Excel + zip uploads (excel-upload/projects). Also raise Tomcat post limit — default ~2MB causes 413 before Spring parses multipart.
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
server.tomcat.max-http-form-post-size=300MB

# Public site origin for AMP web-story <link rel="canonical"> (/stories/{slug}). Override per environment.
