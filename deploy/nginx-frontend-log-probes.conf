# Snippet for mypropertyfact.in (frontend) — log secret-scan probes into Next/IP tracker.
#
# Problem: `deny all` on /.env /.git /.aws never reaches Next middleware, so
# Traffic & Logs cannot show those scans (only nginx access.log on SSH does).
#
# Fix: proxy probe paths to Next (middleware records SCAN), then still 404.
# Keep Cloudflare custom rule if you want edge blocking; for dashboard visibility
# either skip that CF rule for these paths OR view them in Cloudflare Security Events.
#
# Apply inside the main `server { ... }` for mypropertyfact.in, BEFORE the
# generic `location /` block. Then: sudo nginx -t && sudo systemctl reload nginx

# Secret / CMS probes → Next (tracked) then not-found
location ~* /(\.env|\.git|\.aws|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
}
